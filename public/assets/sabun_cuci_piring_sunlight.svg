<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="dishBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="pouchGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="pouchShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#dishBg)"/>

  <!-- Dishwashing Soap Pouch -->
  <g filter="url(#pouchShadow)" transform="translate(120, 25)">
    <!-- Red Spout -->
    <rect x="25" y="6" width="20" height="18" rx="4" fill="#dc2626"/>
    <rect x="21" y="20" width="28" height="6" rx="2" fill="#991b1b"/>

    <!-- Pouch Body -->
    <path d="M 15 26 L 145 26 L 155 220 Q 155 240 135 242 L 25 242 Q 5 240 5 220 Z" fill="url(#pouchGreen)" stroke="#15803d" stroke-width="2"/>
    
    <!-- Sun Ray / Bright Arc -->
    <ellipse cx="80" cy="55" rx="55" ry="25" fill="#facc15" opacity="0.9"/>
    <text x="80" y="62" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#15803d" letter-spacing="1">SUNLIGHT</text>

    <!-- Lime Slice Illustration -->
    <circle cx="80" cy="125" r="32" fill="#a3e635" stroke="#15803d" stroke-width="3"/>
    <circle cx="80" cy="125" r="26" fill="#65a30d"/>
    <circle cx="80" cy="125" r="8" fill="#d9f99d"/>
    <line x1="80" y1="99" x2="80" y2="151" stroke="#d9f99d" stroke-width="2"/>
    <line x1="54" y1="125" x2="106" y2="125" stroke="#d9f99d" stroke-width="2"/>
    <line x1="62" y1="107" x2="98" y2="143" stroke="#d9f99d" stroke-width="2"/>
    <line x1="62" y1="143" x2="98" y2="107" stroke="#d9f99d" stroke-width="2"/>

    <!-- Text labels -->
    <text x="80" y="175" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff">JERUK NIPIS 100</text>
    <text x="80" y="190" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="9" fill="#fef08a">Pembersih Lemak Bandel</text>

    <!-- Volume Tag -->
    <rect x="40" y="202" width="80" height="24" rx="8" fill="#facc15"/>
    <text x="80" y="218" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="11" fill="#15803d">REFILL 650 mL</text>
  </g>
</svg>
