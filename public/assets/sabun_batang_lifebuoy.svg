<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="soapPackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="60%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="soapBarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <filter id="soapShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>

  <!-- Decorative Bubbles -->
  <circle cx="70" cy="60" r="18" fill="#ffffff" opacity="0.8"/>
  <circle cx="75" cy="55" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="340" cy="80" r="24" fill="#ffffff" opacity="0.7"/>
  <circle cx="330" cy="190" r="14" fill="#ffffff" opacity="0.6"/>
  <circle cx="50" cy="220" r="12" fill="#ffffff" opacity="0.7"/>

  <!-- Soap Bar (Unwrapped in front) -->
  <g filter="url(#soapShadow)" transform="translate(60, 110)">
    <!-- Base Soap Curved Bar -->
    <rect x="0" y="20" width="160" height="100" rx="30" fill="url(#soapBarGrad)" stroke="#f87171" stroke-width="2"/>
    <!-- Soap Emboss Stamp -->
    <rect x="25" y="45" width="110" height="50" rx="15" fill="none" stroke="#fca5a5" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="80" y="74" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14" fill="#ef4444" letter-spacing="2">LIFECARE</text>
    <text x="80" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="9" fill="#991b1b">TOTAL PROTECT 110g</text>
    <!-- Highlight Reflection -->
    <path d="M 25 35 Q 80 25 135 35" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Soap Packaging Box (Behind & Angled) -->
  <g filter="url(#soapShadow)" transform="translate(180, 50)">
    <rect x="0" y="0" width="165" height="190" rx="16" fill="url(#soapPackGrad)"/>
    <!-- White Wave Band -->
    <path d="M 0 50 Q 82 20 165 50 L 165 140 Q 82 170 0 140 Z" fill="#ffffff"/>
    
    <!-- Red Cross Logo on Pack -->
    <circle cx="82" cy="75" r="22" fill="#dc2626"/>
    <rect x="76" y="62" width="12" height="26" rx="2" fill="#ffffff"/>
    <rect x="69" y="69" width="26" height="12" rx="2" fill="#ffffff"/>
    
    <!-- Pack Typography -->
    <text x="82" y="115" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#1e293b" letter-spacing="1">SABUN MANDI</text>
    <text x="82" y="130" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#dc2626">ANTI BAKTERI</text>
    <text x="82" y="170" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="10" fill="#fecaca">Perlindungan 24 Jam</text>
    
    <!-- Netto Tag -->
    <rect x="100" y="12" width="55" height="20" rx="6" fill="#fef08a"/>
    <text x="127" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="9" fill="#854d0e">BATANG 110g</text>
  </g>
</svg>
