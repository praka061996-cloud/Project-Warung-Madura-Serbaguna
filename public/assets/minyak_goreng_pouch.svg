<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="oilBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="pouchShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#oilBg)"/>

  <!-- Oil Pouch -->
  <g filter="url(#pouchShadow)" transform="translate(115, 25)">
    <!-- Red Spout Cap -->
    <rect x="30" y="8" width="22" height="18" rx="4" fill="url(#capGrad)"/>
    <rect x="26" y="24" width="30" height="6" rx="2" fill="#991b1b"/>

    <!-- Pouch Body -->
    <path d="M 20 30 L 150 30 L 160 215 Q 160 235 140 238 L 30 238 Q 10 235 10 215 Z" fill="url(#pouchGrad)" stroke="#ca8a04" stroke-width="2"/>
    
    <!-- Top Seal Line -->
    <line x1="20" y1="42" x2="150" y2="42" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Brand Header -->
    <rect x="22" y="52" width="126" height="40" rx="8" fill="#15803d"/>
    <text x="85" y="74" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff" letter-spacing="2">SANIA</text>
    <text x="85" y="87" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="9" fill="#fef08a">MINYAK GORENG SAWIT</text>

    <!-- Clear Oil Window Illusion -->
    <ellipse cx="85" cy="140" rx="45" ry="32" fill="#fde047" stroke="#ffffff" stroke-width="3"/>
    <path d="M 50 145 Q 85 130 120 145" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <text x="85" y="146" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="12" fill="#a16207">JERNIH &amp; SEHAT</text>

    <!-- Volume Tag -->
    <rect x="45" y="188" width="80" height="28" rx="8" fill="#dc2626"/>
    <text x="85" y="206" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="13" fill="#ffffff">REFILL 2 LITER</text>
  </g>
</svg>
